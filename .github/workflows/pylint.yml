name: Python Syntax Check

on: [push]

jobs:
  syntax:
    runs-on: windows-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.10"
    
    - name: Check Python syntax
      run: |
        python -m py_compile $(git ls-files '*.py')
